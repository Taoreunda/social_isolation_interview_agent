[project]
name = "social-isolation-interview-agent"
version = "0.1.0"
description = "Role-separated social isolation interview research application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.27",
    "langgraph>=0.6.7",
    "python-dotenv>=1.1.1",
    "langchain-openai>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.16,<2",
    "argon2-cffi>=23.1,<26",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
]
